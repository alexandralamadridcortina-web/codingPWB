<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Organizador de tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/a2e0b4a5e6.js" crossorigin="anonymous"></script>
</head>
<body class="d-flex flex-column min-vh-100">


  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><i class="fas fa-check-double me-2"></i>Organizador de tareas</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#inicio">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#tareas">Tareas</a></li>
          <li class="nav-item"><a class="nav-link" href="#agregar">Agregar</a></li>
        </ul>
      </div>
    </div>
  </nav>


  <main class="container my-5 flex-grow-1">


    <section id="inicio" class="mb-5">
      <h2>Bienvenido a tu lista de tareas</h2>
      <p>Usa esta aplicación para organizar tus actividades del día.</p>
    </section>


    <div id="alerta" class="alert alert-success d-none" role="alert">
      ✅ Tarea agregada correctamente.
    </div>


    <section id="agregar" class="mb-4">
      <h3>Agregar nueva tarea</h3>
      <form id="formTarea">
        <div class="input-group">
          <input type="text" id="inputTarea" class="form-control" placeholder="Escribe una nueva tarea" required />
          <button type="submit" class="btn btn-primary">Agregar</button>
        </div>
      </form>
    </section>


    <section id="tareas">
      <h3>Tus tareas</h3>
      <ul id="listaTareas" class="list-group"></ul>
    </section>

  </main>


  <footer class="bg-dark text-white text-center py-3 mt-auto">
    Creado por: Alexandra Lamadrid.  
    <div class="mt-2">
      <a href="https://www.linkedin.com/in/alexandra-lamadrid-cortina/" target="_blank" class="text-white me-3">
        <i class="bi bi-linkedin"></i> LinkedIn
      </a>
      <a href="https://github.com/AlexandraLamadrid" target="_blank" class="text-white">
        <i class="bi bi-github"></i> GitHub
      </a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
